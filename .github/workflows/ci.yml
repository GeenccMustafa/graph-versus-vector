name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Docstrings (pydocstyle)
        run: uv run pydocstyle src/rag_compare tests
      - name: Types (mypy)
        run: uv run mypy src/rag_compare
      - name: Tests (pytest)
        run: uv run pytest
