[project]
name = "rag-compare"
version = "0.1.0"
description = "Compare GraphRAG (Neo4j knowledge graph) against traditional vector RAG on multi-hop QA."
readme = "README.md"
authors = [
    { name = "rag-compare contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.6",
    "httpx>=0.28",
    "langfuse>=4.15.6",
    "neo4j>=5.28",
    "networkx>=3.4",
    "numpy>=2.1",
    "openai>=1.60",
    "prefect>=3.8.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "tenacity>=9.0",
    "tqdm>=4.67",
    "typer>=0.15",
]

[project.scripts]
rag-compare = "rag_compare.cli:app"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pydocstyle>=6.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/rag_compare/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false


